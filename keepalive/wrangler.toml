name = "keypath-keepalive"
main = "src/index.js"
compatibility_date = "2026-08-01"

# 每 2 天 UTC 03:00 触发一次（北京时间 11:00）。
# Supabase 的暂停阈值是 7 天无活动，2 天的间隔留足了余量：
# 即便连续两次触发失败，累计也才 6 天，仍不会被暂停。
[triggers]
crons = ["0 3 */2 * *"]

